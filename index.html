<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Card</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#05070d;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:30px;
}

.card{
    width:380px;
    background:#11141f;
    border:2px solid #00ff9d;
    border-radius:20px;
    padding:30px;
    position:relative;
    text-align:center;
    box-shadow:0 0 15px #00ff9d,
               0 0 40px rgba(0,255,157,.3);
    transition:.4s;
}

.card:hover{
    box-shadow:0 0 25px #00ff9d,
               0 0 60px rgba(0,255,157,.6);
}

.tag{
    position:absolute;
    top:18px;
    right:18px;
    background:#00ff9d;
    color:#000;
    padding:8px 16px;
    border-radius:8px;
    font-size:12px;
    font-weight:bold;
    letter-spacing:1px;
}

.avatar{
    width:130px;
    height:130px;
    margin:20px auto;
    border:4px solid #00ff9d;
    border-radius:14px;
    overflow:hidden;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

h2{
    color:#00ff9d;
    margin-top:15px;
    font-size:32px;
}

.subtitle{
    color:#8b93b1;
    margin:10px 0 30px;
}

.stat{
    margin-bottom:22px;
    text-align:left;
}

.stat-header{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
    color:#b0b9c9;
    font-size:15px;
}

.progress-bar{
    width:100%;
    height:7px;
    background:#1b2130;
    border-radius:10px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    border-radius:10px;
}

.progress-green{
    width:90%;
    background:#00ff66;
    box-shadow:0 0 10px #00ff66;
}

.progress-blue{
    width:80%;
    background:#00e5ff;
    box-shadow:0 0 10px #00e5ff;
}

.btn{
    margin-top:15px;
    width:100%;
    padding:14px;
    border:2px solid #00ff66;
    background:transparent;
    color:#00ff66;
    border-radius:10px;
    font-weight:bold;
    letter-spacing:1px;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    background:#00ff66;
    color:#000;
    box-shadow:0 0 15px #00ff66;
}

</style>
</head>

<body>

<div class="card">

<div class="tag">PRO AGENT</div>

<div class="avatar">
<img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=500" alt="">
</div>

<h2>NET_RUNNER</h2>

<p class="subtitle">
Спеціалізація: Кібербезпека
</p>

<div class="stat">
<div class="stat-header">
<span>Швидкість коду</span>
<span>90%</span>
</div>

<div class="progress-bar">
<div class="progress-fill progress-green"></div>
</div>
</div>

<div class="stat">
<div class="stat-header">
<span>Стелс / Захист</span>
<span>80%</span>
</div>

<div class="progress-bar">
<div class="progress-fill progress-blue"></div>
</div>
</div>

<button class="btn">
ЗАВАНТАЖИТИ ПРОФІЛЬ
</button>

</div>

</body>
</html>
